<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="12" fill="#080808"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="11.5" stroke="#303030"/>
  
  <!-- Subtle Grid Background -->
  <defs>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151515" stroke-width="1"/>
    </pattern>
    <linearGradient id="chrome-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222222" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="silver-accent" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A7A7A7"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#grid-pattern)" opacity="0.6"/>
  
  <!-- App Header Bar -->
  <rect x="40" y="40" width="720" height="48" rx="8" fill="#141414" stroke="#252525"/>
  <circle cx="64" cy="64" r="6" fill="#444444"/>
  <circle cx="82" cy="64" r="6" fill="#333333"/>
  <circle cx="100" cy="64" r="6" fill="#333333"/>
  <rect x="140" y="56" width="160" height="16" rx="4" fill="#222222"/>
  <rect x="620" y="54" width="110" height="20" rx="4" fill="#202020" stroke="#303030"/>
  
  <!-- Kanban Columns -->
  <!-- Col 1: Backlog -->
  <rect x="40" y="110" width="220" height="340" rx="8" fill="#0E0E0E" stroke="#1E1E1E"/>
  <text x="60" y="138" fill="#A7A7A7" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">BACKLOG (4)</text>
  <rect x="56" y="156" width="188" height="76" rx="6" fill="url(#chrome-card)" stroke="#2C2C2C"/>
  <rect x="70" y="172" width="110" height="8" rx="2" fill="#D9D9D9"/>
  <rect x="70" y="188" width="150" height="6" rx="2" fill="#555555"/>
  <rect x="70" y="202" width="50" height="14" rx="3" fill="#222222" stroke="#444444"/>
  
  <rect x="56" y="244" width="188" height="64" rx="6" fill="url(#chrome-card)" stroke="#2C2C2C"/>
  <rect x="70" y="260" width="90" height="8" rx="2" fill="#D9D9D9"/>
  <rect x="70" y="276" width="130" height="6" rx="2" fill="#555555"/>

  <!-- Col 2: In Progress -->
  <rect x="290" y="110" width="220" height="340" rx="8" fill="#0E0E0E" stroke="#2A2A2A"/>
  <text x="310" y="138" fill="#F5F5F5" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">IN PROGRESS (2)</text>
  <rect x="306" y="156" width="188" height="96" rx="6" fill="url(#chrome-card)" stroke="#404040"/>
  <rect x="320" y="172" width="130" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="320" y="190" width="160" height="6" rx="2" fill="#777777"/>
  <rect x="320" y="202" width="140" height="6" rx="2" fill="#555555"/>
  <rect x="320" y="222" width="60" height="14" rx="3" fill="#303030" stroke="#666666"/>
  <circle cx="460" cy="229" r="10" fill="#555555" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Col 3: Completed -->
  <rect x="540" y="110" width="220" height="340" rx="8" fill="#0E0E0E" stroke="#1E1E1E"/>
  <text x="560" y="138" fill="#A7A7A7" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">SHIPPED (12)</text>
  <rect x="556" y="156" width="188" height="70" rx="6" fill="url(#chrome-card)" stroke="#2C2C2C"/>
  <rect x="570" y="172" width="120" height="8" rx="2" fill="#A7A7A7"/>
  <rect x="570" y="188" width="140" height="6" rx="2" fill="#444444"/>
  <rect x="570" y="202" width="45" height="12" rx="3" fill="#1C2D20" stroke="#3A6B42"/>

  <!-- Real-time sync badge -->
  <rect x="330" y="410" width="140" height="26" rx="13" fill="#1A1A1A" stroke="#444444"/>
  <circle cx="346" cy="423" r="4" fill="#D9D9D9"/>
  <text x="358" y="427" fill="#E5E5E5" font-family="monospace" font-size="11">Live WebSocket</text>
</svg>
