services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectryx_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Vectryx Backend API
      - ENVIRONMENT=production
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=vectryx_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-generate_a_secure_random_64_char_secret_key_here}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: vectryx_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
